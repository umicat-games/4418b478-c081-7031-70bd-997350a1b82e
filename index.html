<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Blokus</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; background: #0d0f16; }
      canvas { display: block; width: 100%; height: 100%; }
      /* The UI of a 3D game on the web is DOM. There is no reason to draw a
         score with triangles, and every reason not to: a real <input> is the
         only thing with an IME and a soft keyboard. */
      #hud {
        /* Above the platform's on-screen control layer (z-index 10), which
           this game does not mount — but the layer belongs to the SDK and a
           HUD that assumes it is absent is a HUD that disappears the day it
           is not. */
        z-index: 20;
        /* Top-left, where the eye lands and where the turn line belongs. The
           scoreboard has the opposite corner and the tray owns the bottom. */
        position: fixed;
        left: max(14px, env(safe-area-inset-left));
        top: max(12px, env(safe-area-inset-top));
        pointer-events: none;
        color: #f3f4fa;
        max-width: 56vw;
      }
      /* The HUD stays click-through so the board behind it is still playable;
         anything interactive turns pointer events back on for itself. */
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
