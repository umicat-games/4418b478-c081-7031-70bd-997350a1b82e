<!DOCTYPE html>
<!-- `lang` 的初值不重要：`i18n.ts` 在定下语言之后会改写它。写 en 而不是
     zh-CN，是因为一个还没被改写的值应该是「未知」的那个默认，而不是某种
     具体语言 —— 万一改写没跑，中文页面标着 en 比英文页面标着 zh-CN 更容易
     被发现。 -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>星港防线 STARHOLD</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; background: #04060c; }
      canvas { display: block; width: 100%; height: 100%; }
      /* 游戏 UI 全部挂在 #hud 的子元素上，绝不直接写 hud.textContent
        （会清空平台挂载的触屏控件）。 */
      #hud {
        z-index: 20;
        position: fixed; inset: 0; pointer-events: none;
        font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #fff; user-select: none; -webkit-user-select: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
