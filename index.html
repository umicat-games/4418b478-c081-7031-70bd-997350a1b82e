<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>GO with me</title>
    <!-- The title screen's artwork, fetched while the bundle is still being
         parsed rather than when the screen is built: a preload the HTML
         parser can see starts seconds before one JavaScript asks for. These
         are the derived copies in public/art/ — see CLAUDE.md for where the
         originals live and how these were made. -->
    <link rel="preload" as="image" href="art/logo.webp">
    <link rel="preload" as="image" href="art/table-bg.webp">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; background: #000; }
      canvas { display: block; width: 100%; height: 100%; }
      /* Simple text HUD. A 3D game's UI is DOM on the web — there is no reason
         to draw a score with triangles. */
      #hud {
        /* Above the platform's on-screen controls, which are a full-screen
           layer at z-index 10. A HUD is the game's own first-class UI, and a
           button in it — a mute toggle, a shop tab — is otherwise unreachable
           on a phone while looking perfectly normal. The SDK also keeps its
           zones out of the top of the screen, but that is a default sized for
           a short HUD, not a guarantee. */
        z-index: 20;
        /* Bottom-left, not top-left: the chat pill owns the top of the screen
           when the panel is closed, and a button that overlaps the board is a
           button a thumb presses while trying to play a stone. */
        position: fixed; left: max(16px, env(safe-area-inset-left));
        bottom: max(14px, env(safe-area-inset-bottom)); pointer-events: none;
        /* Dark ink on a light table — and a HALO rather than a drop shadow,
           because this text crosses from pale wood onto the board and back,
           and a halo is what survives both. */
        font: 600 16px/1.5 system-ui, sans-serif; color: #241f19;
        text-shadow: 0 1px 0 rgba(255,255,255,.75), 0 0 8px rgba(255,255,255,.65);
        max-width: 80vw;
      }
      /* The HUD itself stays click-through so the board behind it is still
         playable; anything interactive turns pointer events back on. */
      #hud .lesson { margin-bottom: 6px; }
      #hud .lesson:empty { display: none; }
      #hud .lesson .head {
        font-size: 11px; letter-spacing: .07em; text-transform: uppercase;
        color: #7fd6c2; font-weight: 700;
      }
      #hud .lesson .goal { font-size: 15px; font-weight: 600; }
      #hud .tip {
        font-weight: 500; font-size: 13px; opacity: .72; margin-top: 2px;
      }
      #hud .tip:empty { display: none; }
      #hud .bar { display: flex; gap: 10px; margin-top: 10px; pointer-events: auto; flex-wrap: wrap; max-width: 46vw; }
      /* The gear is the only button out here; how it LOOKS is buttons.css,
         which the modules import. */
      #hud button[hidden] { display: none; }
      #hud button.icon { width: 44px; height: 44px; padding: 0; border-radius: 50%; display: grid; place-items: center; }
      #hud button.icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
      /* While the conversation is open it belongs to the conversation's corner,
         just above the composer, at the right-hand edge. */
      /* The HUD sits under the chat panel (20 against 25), so a gear moved into
         the panel's corner is a gear behind it. Lifted for as long as it is
         there, and only then. */
      body.chatting #hud { z-index: 26; }
      /* Inside the log's bottom-right corner, with room around it. The first
         version put it ON the panel's bottom edge — the composer sits 54px up,
         so clearing the composer is not the same as clearing the box above it. */
      body.chatting #hud .bar {
        left: auto; right: calc(max(12px, env(safe-area-inset-right)) + 16px);
        bottom: calc(max(12px, env(safe-area-inset-bottom)) + 74px);
        position: fixed; margin: 0;
      }
      body.chatting #hud .status, body.chatting #hud .tip { max-width: 46vw; }
      /* While the title is up, the game's own furniture is not. */
      body.titling #hud, body.titling #chat, body.titling #speech { display: none; }
    </style>
    <style>
      /* The boot screen: black, and a bar.
         It is in the HTML rather than built in JavaScript because the gap it
         covers STARTS before the bundle has parsed — a loading screen that
         arrives with the code it is covering for covers nothing. It carries
         no words, in any language, because the player's language arrives at
         the platform handshake, which is one of the things this is waiting
         for; and no artwork, because the title screen is where the artwork
         belongs. */
      #boot {
        position: fixed; inset: 0; z-index: 60;
        display: flex; align-items: center; justify-content: center;
        background: #0c0e12;
        transition: opacity .22s ease-out;
      }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot .track {
        width: min(260px, 56vw); height: 6px; border-radius: 99px;
        background: rgba(0, 0, 0, .38); box-shadow: 0 0 0 1px rgba(255, 255, 255, .18);
        overflow: hidden;
      }
      #boot .track i {
        display: block; height: 100%; width: 0%; border-radius: 99px;
        /* Solid, not a gradient: at eight per cent a gradient shows only its
           dark end, which reads as an empty track. */
        background: #7fd6c2;
        transition: width .35s cubic-bezier(.3,.8,.4,1);
      }
    </style>
  </head>
  <body>
    <!-- The boot screen.
         Written into the HTML, with its own styles, because its whole job is
         to be on screen BEFORE the bundle has parsed — a loading bar that
         arrives with the code it is covering for is a loading bar that covers
         nothing. It is wordless on purpose: the player's language comes from
         the platform at handshake, which is one of the things this is waiting
         for. `window.__boot` is what the game drives it with; it removes
         itself when the title screen is dressed, and on a timer regardless,
         because nobody should ever be stuck behind a progress bar. -->
    <div id="boot"><div class="track"><i></i></div></div>
    <script>
      // In the BODY, after the element: in <head> this ran before the div
      // was parsed, `getElementById` returned null, and the whole thing was
      // a silent no-op — a loading bar that never moved and never left.
      (function () {
        var el = document.getElementById('boot');
        var fill = el && el.querySelector('i');
        var at = 0, timer;
        function paint() { if (fill) fill.style.width = Math.min(at, 1) * 100 + '%'; }
        // Creep between milestones, so a bar that is genuinely waiting still
        // looks like it is doing something — but never past the next one, so
        // it is not pretending to know more than it does.
        function creep(target) {
          clearInterval(timer);
          timer = setInterval(function () {
            if (at >= target) { clearInterval(timer); return; }
            at += (target - at) * 0.08;
            paint();
          }, 120);
        }
        window.__boot = {
          step: function (p) { if (p > at) { at = p; paint(); } creep(Math.min(p + 0.12, 0.95)); },
          done: function () {
            if (!el) return;
            // Hold the node in a local BEFORE letting go of `el`: the timeout
            // below runs three hundred milliseconds later, and reading a
            // reference that has since been nulled throws inside a callback
            // nobody is watching — which left the screen in the DOM for ever,
            // invisible and untouchable, with one line in the console.
            var node = el;
            el = null;
            clearInterval(timer);
            at = 1; paint();
            node.classList.add('done');
            setTimeout(function () { node.remove(); }, 300);
          },
        };
        // Start visible: a bar at 8% of a 260px track is four pixels, which
        // nobody reads as "it has started".
        window.__boot.step(0.14);
        // The backstop. If anything below never reports, the game is still
        // behind this rectangle, and a game nobody can reach is worse than a
        // game that looks unfinished for a moment.
        setTimeout(function () { window.__boot.done(); }, 9000);
      }());
    </script>

    <canvas id="game"></canvas>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
