<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Umicat Game</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      /* NOTHING HERE IS TEXT TO BE READ AND COPIED — it is a game, and every
         string on screen is a label on something you press or a number you
         watch. Left selectable, a long press on `Continue` puts iOS's selection
         handles and its magnifier over the title screen, and a thumb that
         drifts while working the stick can drag a highlight across the HUD.
         This is the same lesson the icons already carry: `src/icons.ts` stopped
         using emoji partly because they are TEXT, and long-pressing the attack
         button brought up Copy / Look Up / Translate mid-fight. That fix was
         made one element at a time; this is the rest of it.

         `-webkit-touch-callout` is the callout menu and is separate from
         selection — both have to go. `-webkit-tap-highlight-color` is the grey
         flash iOS paints on a tap, which fights the buttons' own press.

         If a screen ever does want selectable text, it opts back IN with
         `user-select: text`. */
      * {
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      html, body { height: 100%; overflow: hidden; background: #000; }
      canvas { display: block; width: 100%; height: 100%; }
      /* Simple text HUD. A 3D game's UI is DOM on the web — there is no reason
         to draw a score with triangles. */
      #hud {
        /* Above the platform's on-screen controls, which are a full-screen
           layer at z-index 10. A HUD is the game's own first-class UI and any
           button in it — a mute toggle, a shop tab — is otherwise unreachable
           on a phone while looking perfectly normal. Children that need taps
           set `pointer-events: auto`; the HUD itself stays click-through. */
        z-index: 20;
        position: fixed; left: 16px; top: 14px; pointer-events: none;
        font: 600 16px/1.5 system-ui, sans-serif; color: #fff;
        text-shadow: 0 2px 6px rgba(0,0,0,.55); max-width: 80vw;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
