<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Umicat Game</title>
    <!-- Warm the browser cache for the loading-screen icon sheet IN PARALLEL with the JS
         bundle + fonts, so the drifting-icon wallpaper appears together with the loader
         (not a beat later, once BootScene's own load of it finishes). -->
    <link rel="preload" as="image" href="uploaded/all_icons.png" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="uploaded/zpix.woff2" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #aed499; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
      /* Pure CSS boot loader — renders on the FIRST paint (no JS/font/image dependency),
         so the whole app-load is a steady cream screen with a cozy animated bar instead of
         a blank/flashing wait. The game removes #boot once it's ready to wipe into the title. */
      #boot { position: fixed; inset: 0; background: #aed499; display: flex; align-items: center; justify-content: center; z-index: 9999; }
      #boot .box { display: flex; flex-direction: column; align-items: center; gap: 16px; }
      #boot .txt { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 600; letter-spacing: 3px; color: #5a6e37; }
      #boot .txt::after { content: ''; display: inline-block; width: 1.4em; text-align: left; animation: umi-dots 1.4s steps(1) infinite; }
      #boot .bar { position: relative; width: 220px; height: 12px; background: #cfe3b6; border-radius: 8px; overflow: hidden; }
      #boot .bar > i { position: absolute; top: 0; height: 100%; width: 36%; background: #6e9a4a; border-radius: 8px; animation: umi-load 1.1s ease-in-out infinite; }
      @keyframes umi-load { 0% { left: -40%; } 100% { left: 104%; } }
      @keyframes umi-dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75%, 100% { content: '...'; } }
    </style>
  </head>
  <body>
    <div id="boot"><div class="box"><div class="txt">Loading</div><div class="bar"><i></i></div></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
